# Passwords generated in-cluster by External Secrets (ClusterGenerator password-cluster-generator), never in Git nor in install.sh.
# ENCRYPTION_KEY encrypts every secret stored in Infisical: a new key makes the database unreadable.
# So the Secret is created once and never rewritten, and it outlives this ExternalSecret:
# - refreshPolicy CreatedOnce: generated and written once, by the first sync of this ExternalSecret, never again
#   (CreatedOnce means once per ExternalSecret, even if the Secret already exists).
# - Disaster recovery: the key comes from the recovery kit (./install.sh recovery-kit, docs/BACKUP.md).
# - creationPolicy Orphan + Prune=false,Delete=false: removing the brick or this file never deletes it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
  name: infisical-secrets
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: infisical-secrets
    # Disaster recovery (global.backup.restore.from): the key comes from the recovery kit, applied before the
    # install; None = this ExternalSecret writes nothing. CreatedOnce never syncs again, so removing
    # restore.from later does not overwrite it either.
    creationPolicy: {{ if dig "backup" "restore" "from" "" (.Values.global | default dict) }}None{{ else }}Orphan{{ end }}
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        ENCRYPTION_KEY: {{`'{{ .enc | sha256sum | trunc 32 }}'`}}
        AUTH_SECRET: {{`'{{ .auth | b64enc }}'`}}
        VALKEY_PASSWORD: {{`'{{ .valkey }}'`}}
        REDIS_URL: {{`'redis://:{{ .valkey }}@infisical-valkey.infisical.svc:6379'`}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: enc
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: auth
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-cluster-generator
      rewrite:
        - regexp:
            source: password
            target: valkey
