# Backup S3 keys: install.sh writes ONE plain Secret, external-secrets/backup-s3 (ACCESS_KEY_ID,
# ACCESS_SECRET_KEY), from BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY. Never in Git, never in
# Infisical: Infisical cannot hold the key needed to restore Infisical itself.
# This ClusterSecretStore lets each Postgres copy it into its own namespace (cnpg-cluster chart,
# global.backup.s3.clusterSecretStore in cluster.yaml). It can read that one Secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-s3-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-s3-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backup-s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-s3-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-s3-reader
subjects:
  - kind: ServiceAccount
    name: backup-s3-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: backup-s3-reader
          namespace: {{ .Release.Namespace }}
